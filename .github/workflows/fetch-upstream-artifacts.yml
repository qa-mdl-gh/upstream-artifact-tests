name: Fetch upstream artifacts + publish HTML report (Windows)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * *" # daily (UTC)

permissions:
  contents: write   # needed to publish to gh-pages
  pages: write
  id-token: write

jobs:
  run:
    runs-on: windows-latest

    env:
      MATERIALX_REPO: AcademySoftwareFoundation/MaterialX
      MATERIALX_WORKFLOW: main
      MATERIALX_BRANCH: main
      MATERIALX_ARTIFACT_NAME: MaterialX_Windows_VS2022_x64_Python314

      MDL_REPO: NVIDIA/MDL-SDK

    steps:
      - uses: actions/checkout@v4

      - name: Confirm gh is available
        shell: pwsh
        run: gh --version

      - name: Download MaterialX artifact (search recent successful runs; per_page=100)
        id: materialx
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "artifacts\materialx"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Remove-Item -Recurse -Force "$dest\*" -ErrorAction SilentlyContinue

          $runIdsText = gh run list `
            -R $env:MATERIALX_REPO `
            -w $env:MATERIALX_WORKFLOW `
            -b $env:MATERIALX_BRANCH `
            -L 40 `
            --json databaseId,conclusion `
            -q '.[] | select(.conclusion=="success") | .databaseId'

          $runIds = $runIdsText -split "`n" | Where-Object { $_ -match '^\d+$' }
          if (-not $runIds -or $runIds.Count -eq 0) {
            throw "No successful runs found. Check MATERIALX_WORKFLOW/MATERIALX_BRANCH."
          }

          $foundRun = $null
          foreach ($id in $runIds) {
            $apiPath = "/repos/$env:MATERIALX_REPO/actions/runs/$id/artifacts?per_page=100"
            $namesText = gh api $apiPath --jq ".artifacts[].name"
            $names = @()
            if ($namesText) { $names = $namesText -split "`n" }

            if ($names -contains $env:MATERIALX_ARTIFACT_NAME) {
              $foundRun = $id
              break
            }
          }

          if (-not $foundRun) {
            throw "Did not find '$env:MATERIALX_ARTIFACT_NAME' in the last $($runIds.Count) successful runs."
          }

          gh run download $foundRun `
            -R $env:MATERIALX_REPO `
            -n $env:MATERIALX_ARTIFACT_NAME `
            -D $dest | Out-Host

          "materialx_run_id=$foundRun" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download latest MDL-SDK nt-x86-64.zip (via API)
        id: mdl
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "artifacts\mdl"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Remove-Item -Recurse -Force "$dest\*" -ErrorAction SilentlyContinue

          $tag = gh api "/repos/$env:MDL_REPO/releases/latest" --jq ".tag_name"
          $assetName = gh api "/repos/$env:MDL_REPO/releases/latest" --jq `
            '.assets[] | select(.name | endswith("nt-x86-64.zip")) | .name' |
            Select-Object -First 1
          $assetUrl = gh api "/repos/$env:MDL_REPO/releases/latest" --jq `
            '.assets[] | select(.name | endswith("nt-x86-64.zip")) | .browser_download_url' |
            Select-Object -First 1

          if (-not $assetUrl) { throw "No nt-x86-64.zip found in latest release assets for $env:MDL_REPO" }

          $outPath = Join-Path $dest $assetName
          Invoke-WebRequest -Uri $assetUrl -OutFile $outPath

          "mdl_release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "mdl_asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate HTML report
        if: always()
        shell: pwsh
        run: |
          python tools\make_html_report.py `
            --out test-results\report.html `
            --materialx-dir artifacts\materialx `
            --mdl-dir artifacts\mdl `
            --materialx-artifact-name "${{ env.MATERIALX_ARTIFACT_NAME }}" `
            --materialx-run-id "${{ steps.materialx.outputs.materialx_run_id }}" `
            --mdl-asset-name "${{ steps.mdl.outputs.mdl_asset_name }}" `
            --mdl-release-tag "${{ steps.mdl.outputs.mdl_release_tag }}"

      - name: Upload HTML report as run artifact (easy download from Actions UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: test-results/report.html
          retention-days: 30

      # ----- Publish to GitHub Pages with history -----

      - name: Checkout gh-pages (for history)
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Prepare site content (keep previous reports + add this run)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force site | Out-Null

          # If gh-pages exists, copy it into site (excluding .git)
          if (Test-Path "pages") {
            Get-ChildItem -Force "pages" | Where-Object { $_.Name -ne ".git" } | ForEach-Object {
              Copy-Item $_.FullName "site" -Recurse -Force
            }
          }

          $runId = "${{ github.run_id }}"
          New-Item -ItemType Directory -Force "site\reports\$runId" | Out-Null
          Copy-Item "test-results\report.html" "site\reports\$runId\index.html" -Force

          New-Item -ItemType Directory -Force "site\reports\latest" | Out-Null
          Copy-Item "test-results\report.html" "site\reports\latest\index.html" -Force

          # Simple index page listing all runs we have
          New-Item -ItemType Directory -Force "site\reports" | Out-Null
          $dirs = Get-ChildItem "site\reports" -Directory | Where-Object { $_.Name -match '^\d+$' } | Sort-Object Name -Descending
          $links = $dirs | ForEach-Object { "<li><a href=`"reports/$($_.Name)/`">$($_.Name)</a></li>" }

          @"
          <!doctype html>
          <html><head><meta charset="utf-8"><title>Test Reports</title></head>
          <body style="font-family:Segoe UI, Arial; margin:24px;">
            <h1>Test Reports</h1>
            <p><a href="reports/latest/">Latest</a></p>
            <h2>History (by GitHub run_id)</h2>
            <ul>
              $($links -join "`n")
            </ul>
          </body></html>
          "@ | Set-Content -Encoding UTF8 site\index.html

      - name: Publish to GitHub Pages (gh-pages branch)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
